name: 営業開始ストーリー

on:
  schedule:
    # 毎日 8:15(日本時間)に起動。GitHubの混雑で遅れることがあるので早めに起動し、
    # 9:28 より前に動いたときは 9:28 まで待ってから投稿する
    - cron: "15 23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "休みの日・投稿済みでも投稿する(テスト用)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: story
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: 9:28(日本時間)まで待つ
        if: github.event_name == 'schedule'
        run: |
          target=$(TZ=Asia/Tokyo date -d "09:28" +%s)
          now=$(date +%s)
          if [ "$now" -lt "$target" ]; then
            echo "$(( (target - now) / 60 ))分待ちます"
            sleep $(( target - now ))
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install jpholiday

      - name: ストーリーを投稿
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: python post_story.py

      - name: 順番を記録
        run: |
          if ! git diff --quiet state.json; then
            git config user.name "story-bot"
            git config user.email "story-bot@users.noreply.github.com"
            git add state.json
            git commit -m "posted $(TZ=Asia/Tokyo date +%F)"
            git push
          fi
